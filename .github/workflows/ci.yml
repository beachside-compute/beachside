name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/ci-scope.sh
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
  build:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packed: ${{ steps.scope.outputs.packed }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Select packed consumer coverage
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'packed=true' >> "$GITHUB_OUTPUT"
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            # Include both sides of renames so moving a packaging input out still qualifies.
            git diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
            # The release rehearsal tests the release tooling, so it runs only when that changes.
            if grep -Eq \
              -e '^scripts/(release|release-fixture|check-installers|npm-bootstrap|refresh-workspace-lock|assert-pending-changesets)\.mjs$' \
              -e '^scripts/release-packages\.json$' \
              -e '^\.changeset/(config|pre)\.json$' \
              -e '^\.github/workflows/(ci|release-npm|version-prepare)\.yml$' \
              -e '^package\.json$' \
              "$RUNNER_TEMP/changed-files"; then
              echo 'release=true' >> "$GITHUB_OUTPUT"
            else
              test "$?" -eq 1
              echo 'release=false' >> "$GITHUB_OUTPUT"
            fi
            if grep -Eq \
              -e '(^bun.lock$|^\.github/workflows/|^\.changeset/(config\.json|pre\.json)$|^scripts/)' \
              -e '(^|/)(package.json|tsconfig[^/]*\.json|build-assets\.ts|flatten-declarations\.mjs|\.npmignore|\.gitignore)$' \
              -e '^packages/([^/]+|providers/[^/]+)/src/(index|client|server|adapter|portable|testing|bound|factory|process-contract)\.ts$' \
              -e '^packages/([^/]+|providers/[^/]+)/assets/' \
              -e '^packages/sdk-qualification/.*\.(ts|mjs|json)$' \
              -e '^apps/docs/examples/recovery-outcomes\.ts$' \
              "$RUNNER_TEMP/changed-files"; then
              echo 'packed=true' >> "$GITHUB_OUTPUT"
            else
              test "$?" -eq 1
              echo 'packed=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Build shared packages once, in dependency order
        run: bun run build:packages
      - run: bun run check:built
      - name: Archive fresh outputs for this commit and run
        run: |
          shopt -s nullglob
          tar -czf "$RUNNER_TEMP/beachside-build.tar.gz" packages/*/dist packages/providers/*/dist
      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}/beachside-build.tar.gz
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  offline:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        run: tar -xzf "$RUNNER_TEMP/beachside-build.tar.gz"
      - name: SDK, adapter and offline provider contracts
        run: bun run test:sdk:built
  packed:
    needs: build
    if: needs.build.outputs.packed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        run: tar -xzf "$RUNNER_TEMP/beachside-build.tar.gz"
      - parallel:
          - name: Packed Node and Bun consumers
            run: bun run package:smoke:built
          - name: Local OpenTelemetry, Sentry and Datadog fixtures
            run: bun run observability:check
  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
          run_install: false
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        run: tar -xzf "$RUNNER_TEMP/beachside-build.tar.gz"
      - name: Stable and prerelease release rehearsal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run release:fixture
  docs:
    needs: [scope, build]
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.docs == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.full == 'true'
        with:
          name: built-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore this run's build outputs
        if: needs.scope.outputs.full == 'true'
        run: tar -xzf "$RUNNER_TEMP/beachside-build.tar.gz"
      - name: Documentation checks, generated references, site and examples
        if: needs.scope.outputs.full == 'true'
        run: bun run docs:check:built
      - name: Documentation site checks
        if: needs.scope.outputs.full == 'false'
        run: bun run --cwd apps/docs site:check
  verify:
    if: always()
    needs: [scope, quality, build, offline, packed, release, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require selected validation jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .scope.result == "success" and
            .quality.result == "success" and
            (if .scope.outputs.docs == "true" then .docs.result == "success"
             elif .scope.outputs.docs == "false" then .docs.result == "skipped"
             else false end) and
            (if .scope.outputs.full == "false" then
              .build.result == "skipped" and .offline.result == "skipped" and .packed.result == "skipped" and
              .release.result == "skipped"
            elif .scope.outputs.full == "true" then
              .build.result == "success" and .offline.result == "success" and
              (if .build.outputs.packed == "false" then .packed.result == "skipped"
               elif .build.outputs.packed == "true" then .packed.result == "success"
               else false end) and
              (if .build.outputs.release == "false" then .release.result == "skipped"
               elif .build.outputs.release == "true" then .release.result == "success"
               else false end)
            else false end)
          '
