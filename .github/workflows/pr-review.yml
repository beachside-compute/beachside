# Reviews a pull request once, when it is ready for review: Pi runs in a Freestyle sandbox and
# posts one review comment with `gh`. GitHub and model access come from a credential-broker grant
# issued with this job's OIDC token, so the repository holds no GitHub or model keys.
# Setup and the broker policy are in examples/pr-review/README.md.
name: PR review
on:
  pull_request_target:
    # `opened` covers pull requests that never were drafts; drafts are skipped below.
    types: [opened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    # Only when enabled, never on drafts, never on forks, and only for the repository's own people.
    if: >-
      vars.PR_REVIEW_ENABLED == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      # The default branch only. Pull request code is cloned inside the sandbox, never here.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - name: Find the prepared review image
        uses: actions/cache/restore@v4
        with:
          path: .pr-review/image-id
          key: pr-review-image-${{ github.run_id }}
          restore-keys: pr-review-image-
      - name: Review
        run: bun examples/pr-review/review.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REVIEW_IMAGE_FILE: .pr-review/image-id
          REVIEW_GATEWAY: ${{ vars.PR_REVIEW_GATEWAY }}
          REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
          BEACHSIDE_BROKER_URL: ${{ vars.BEACHSIDE_BROKER_URL }}
          BEACHSIDE_BROKER_AUDIENCE: ${{ vars.BEACHSIDE_BROKER_AUDIENCE }}
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
