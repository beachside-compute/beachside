<style>
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    color: #f4ede3;
    font-family: "Instrument Sans", sans-serif;
    background: linear-gradient(#0b1020 0%, #0f1528 50%, #1a1b45 82%, #2a1f55 100%);
  }
  .logo {
    position: absolute;
    top: 56px;
    left: 72px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .mark {
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 52px;
  }
  .msun {
    height: 26px;
    border-radius: 26px 26px 0 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .msun i {
    display: block;
  }
  .msun i:nth-child(1) {
    flex: 4;
    background: #ff7a59;
  }
  .msun i:nth-child(2) {
    flex: 2;
    background: #ef4f91;
  }
  .msun i:nth-child(3) {
    flex: 1.4;
    background: #8e7cf0;
  }
  .mbar {
    height: 6px;
    border-radius: 3px;
    background: #4fe0cf;
  }
  .word {
    font-family: Unbounded;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: 0.04em;
    transform: skewX(-10deg);
  }
  h1 {
    position: absolute;
    left: 72px;
    top: 156px;
    font-family: Unbounded;
    font-weight: 800;
    font-size: 66px;
    letter-spacing: -0.03em;
    line-height: 1.12;
    z-index: 2;
  }
  .hl {
    display: inline-block;
    background: #ef4f91;
    color: #0f1528;
    padding: 2px 22px 10px;
    margin-top: 10px;
  }
  .sub {
    position: absolute;
    left: 72px;
    top: 400px;
    max-width: 640px;
    font-size: 29px;
    font-weight: 600;
    line-height: 1.35;
    z-index: 2;
  }
  .cta {
    position: absolute;
    left: 72px;
    bottom: 48px;
    display: flex;
    align-items: center;
    gap: 22px;
    z-index: 2;
  }
  .btn {
    background: #4fe0cf;
    color: #0f1528;
    font-family: Unbounded;
    font-weight: 700;
    font-size: 22px;
    padding: 12px 24px;
    border-radius: 10px;
  }
  .url {
    font-family: Unbounded;
    font-weight: 700;
    font-size: 22px;
    transform: skewX(-8deg);
    opacity: 0.85;
  }
  .sun {
    position: absolute;
    right: -40px;
    bottom: 96px;
    width: 520px;
    height: 260px;
    border-radius: 520px 520px 0 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .sun i {
    display: block;
  }
  .sea {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 96px;
    background: #0b1020;
  }
  .sea:before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 9px;
    background: #4fe0cf;
  }
  .star {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #f4ede3;
    opacity: 0.5;
  }
